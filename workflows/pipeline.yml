name: NHL EDGE PRO pipeline

on:
  schedule:
    # UTC. 4 runs/day keeps The Odds API free tier (500 credits/month at 3 markets x 1 region) within budget.
    # ~7am, 11am, 2:30pm, 4:30pm Pacific during the season. Edit to taste.
    - cron: "7 14 * * *"
    - cron: "7 18 * * *"
    - cron: "37 21 * * *"
    - cron: "37 23 * * *"
    # weekly re-validation (walk-forward backtest), Monday 10:13 UTC
    - cron: "13 10 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill | daily | backtest | demo"
        required: true
        default: daily

permissions:
  contents: write

concurrency:
  group: nhl-edge-pro-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q tests
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "13 10 * * 1" ]; then echo "mode=backtest" >> $GITHUB_OUTPUT
          else echo "mode=daily" >> $GITHUB_OUTPUT; fi
      - name: Run pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m pipeline.run ${{ steps.mode.outputs.mode }}
      - name: Rebuild site after backfill/backtest
        if: steps.mode.outputs.mode == 'backfill' || steps.mode.outputs.mode == 'backtest'
        env:
          ODDS_API_KEY: ""   # don't spend odds credits on rebuilds
        run: python -m pipeline.run daily
      - name: Commit data
        run: |
          git config user.name "nhl-edge-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data: ${{ steps.mode.outputs.mode }} run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
